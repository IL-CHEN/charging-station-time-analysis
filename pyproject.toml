[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chargstation"
version = "2.0.0"
description = "基于 ACN 数据与机器学习的江苏省充电桩充电行为分析与预测"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "IL-CHEN" }]
license = { text = "MIT" }
keywords = ["charging-station", "machine-learning", "xgboost", "random-forest", "data-analysis"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pytz>=2023.3",
    "requests>=2.31",
    "jieba>=0.42",
    "wordcloud>=1.9",
    "Pillow>=10.0",
    "snownlp>=0.12.3",
]

[tool.setuptools.packages.find]
where = ["src"]
